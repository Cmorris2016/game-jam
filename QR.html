<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QR Code Generator</title>

  <!-- QR Code Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #eef2ff, #f8fafc);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px;
      color: #1e293b;
    }

    .container {
      width: 100%;
      max-width: 950px;
      background: white;
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(15, 23, 42, 0.12);
      overflow: hidden;
    }

    .header {
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: white;
      padding: 35px;
      text-align: center;
    }

    .header h1 {
      font-size: 2.2rem;
      margin-bottom: 8px;
    }

    .header p {
      opacity: 0.9;
      font-size: 1rem;
    }

    .content {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
      padding: 40px;
    }

    .form-section h2,
    .preview-section h2 {
      font-size: 1.2rem;
      margin-bottom: 22px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 8px;
      color: #334155;
    }

    textarea,
    select,
    input[type="number"] {
      width: 100%;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      padding: 13px;
      font-size: 15px;
      outline: none;
      transition: 0.2s;
      background: white;
    }

    textarea {
      min-height: 130px;
      resize: vertical;
    }

    textarea:focus,
    select:focus,
    input[type="number"]:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.12);
    }

    .color-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .color-control {
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      padding: 8px;
    }

    input[type="color"] {
      width: 42px;
      height: 32px;
      border: none;
      background: transparent;
      cursor: pointer;
    }

    .color-value {
      font-size: 13px;
      color: #64748b;
    }

    .button-row {
      display: flex;
      gap: 10px;
      margin-top: 25px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 13px 20px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    .generate-btn {
      flex: 1;
      background: #4f46e5;
      color: white;
    }

    .generate-btn:hover {
      background: #4338ca;
      transform: translateY(-1px);
    }

    .clear-btn {
      background: #f1f5f9;
      color: #475569;
    }

    .clear-btn:hover {
      background: #e2e8f0;
    }

    .preview-section {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .qr-wrapper {
      width: 100%;
      min-height: 350px;
      border: 2px dashed #cbd5e1;
      border-radius: 18px;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 25px;
      background: #f8fafc;
    }

    #qrcode {
      background: white;
      padding: 15px;
      border-radius: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .placeholder {
      text-align: center;
      color: #94a3b8;
    }

    .placeholder-icon {
      font-size: 55px;
      margin-bottom: 15px;
    }

    .download-btn {
      width: 100%;
      margin-top: 20px;
      background: #0f172a;
      color: white;
      display: none;
    }

    .download-btn:hover {
      background: #1e293b;
    }

    .tip {
      margin-top: 15px;
      font-size: 12px;
      color: #94a3b8;
      text-align: center;
    }

    @media (max-width: 750px) {
      body {
        padding: 15px;
      }

      .content {
        grid-template-columns: 1fr;
        padding: 25px;
      }

      .header {
        padding: 28px 20px;
      }

      .header h1 {
        font-size: 1.8rem;
      }

      .qr-wrapper {
        min-height: 300px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <header class="header">
      <h1>QR Code Generator</h1>
      <p>Create customized QR codes instantly</p>
    </header>

    <main class="content">

      <!-- SETTINGS -->
      <section class="form-section">

        <h2>Customize Your QR Code</h2>

        <div class="form-group">
          <label for="qrText">Text or URL</label>

          <textarea
            id="qrText"
            placeholder="Enter a website URL, text, contact information..."
          ></textarea>
        </div>

        <div class="form-group">
          <label for="qrSize">QR Code Size</label>

          <select id="qrSize">
            <option value="200">200 × 200</option>
            <option value="250" selected>250 × 250</option>
            <option value="300">300 × 300</option>
            <option value="400">400 × 400</option>
            <option value="500">500 × 500</option>
          </select>
        </div>

        <div class="form-group">
          <label>Colors</label>

          <div class="color-row">

            <div class="color-control">
              <input type="color" id="darkColor" value="#000000">
              <div>
                <strong>QR Color</strong>
                <div class="color-value" id="darkValue">#000000</div>
              </div>
            </div>

            <div class="color-control">
              <input type="color" id="lightColor" value="#ffffff">
              <div>
                <strong>Background</strong>
                <div class="color-value" id="lightValue">#ffffff</div>
              </div>
            </div>

          </div>
        </div>

        <div class="form-group">
          <label for="errorCorrection">
            Error Correction
          </label>

          <select id="errorCorrection">
            <option value="L">Low — 7%</option>
            <option value="M" selected>Medium — 15%</option>
            <option value="Q">Quartile — 25%</option>
            <option value="H">High — 30%</option>
          </select>
        </div>

        <div class="button-row">
          <button class="generate-btn" onclick="generateQR()">
            Generate QR Code
          </button>

          <button class="clear-btn" onclick="clearQR()">
            Clear
          </button>
        </div>

      </section>

      <!-- PREVIEW -->
      <section class="preview-section">

        <h2>Preview</h2>

        <div class="qr-wrapper">

          <div id="placeholder" class="placeholder">
            <div class="placeholder-icon">▦</div>
            <p>Your QR code will appear here</p>
          </div>

          <div id="qrcode"></div>

        </div>

        <button
          id="downloadBtn"
          class="download-btn"
          onclick="downloadQR()"
        >
          Download PNG
        </button>

        <p class="tip">
          Scan your QR code with your phone to test it.
        </p>

      </section>

    </main>

  </div>

  <script>

    const qrText = document.getElementById("qrText");
    const qrSize = document.getElementById("qrSize");
    const darkColor = document.getElementById("darkColor");
    const lightColor = document.getElementById("lightColor");
    const errorCorrection = document.getElementById("errorCorrection");

    const qrcode = document.getElementById("qrcode");
    const placeholder = document.getElementById("placeholder");
    const downloadBtn = document.getElementById("downloadBtn");

    // Update color labels
    darkColor.addEventListener("input", () => {
      document.getElementById("darkValue").textContent =
        darkColor.value;
    });

    lightColor.addEventListener("input", () => {
      document.getElementById("lightValue").textContent =
        lightColor.value;
    });

    // Generate QR code
    function generateQR() {

      const text = qrText.value.trim();

      if (!text) {
        alert("Please enter some text or a URL.");
        qrText.focus();
        return;
      }

      qrcode.innerHTML = "";

      placeholder.style.display = "none";
      downloadBtn.style.display = "block";

      const size = parseInt(qrSize.value);

      /*
        qrcodejs supports L, M, Q and H error correction.
      */

      new QRCode(qrcode, {
        text: text,
        width: size,
        height: size,
        colorDark: darkColor.value,
        colorLight: lightColor.value,
        correctLevel: QRCode.CorrectLevel[errorCorrection.value]
      });
    }

    // Clear QR code
    function clearQR() {

      qrText.value = "";

      qrcode.innerHTML = "";

      placeholder.style.display = "block";
      downloadBtn.style.display = "none";
    }

    // Download QR code as PNG
    function downloadQR() {

      const canvas = qrcode.querySelector("canvas");

      if (!canvas) {
        alert("Please generate a QR code first.");
        return;
      }

      const link = document.createElement("a");

      link.download = "my-qr-code.png";
      link.href = canvas.toDataURL("image/png");

      link.click();
    }

    // Press Ctrl/Cmd + Enter to generate
    qrText.addEventListener("keydown", function(event) {

      if ((event.ctrlKey || event.metaKey) && event.key === "Enter") {
        generateQR();
      }

    });

  </script>

</body>
</html>
